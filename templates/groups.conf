# 菜单分组定义
#
# 决策 D46：分组是产品分类，属于**数据**，不属于规范条款。
# 加一个分组 = 在这里加一行，框架文件与规范文件都不用改。
#
# 格式：<id> | <显示名> | <order> | <parent> | <说明>
#   id      脚本元数据 `@group` 填的值。[a-z][a-z0-9-]*，全文件唯一
#   显示名  菜单里打出来的标题，**可以含空格**。改措辞不影响任何脚本
#   order   分组之间的排序，越小越靠前
#   parent  可选。填顶层父分组 id 时，此分组在菜单中收为同名虚拟项
#   说明    可选，**只对挂了 parent 的分组有效**。这一栏覆盖什么，
#           显示宽度 ≤ 48 格（一个中文字两格）
#
# `#` 起的行与空行忽略；行内 `#` 之后也当注释剥掉，所以**说明里不能写 `#`**。
# 字段用 `|` 分隔，各字段两端的空白会被去掉。
# lib/registry.sh 读本文件；CI 校验每个脚本的 `@group` 都能在这里找到。
#
# **order 是全局的一条数轴**，顶层分组与收纳分组共用它：菜单按它决定谁先谁后，
# 收纳分组的位置也由自己的 order 决定，而不是由父分组的。因此下面按最终要
# 显示的顺序从 10 起、每档 10 —— 留出的间隔正是为了以后往中间插一个分组时
# 不必推动其余各行。
#
# **说明写这一栏覆盖什么，不点名具体软件。** 菜单只在一个分组只剩一个可见成员
# 时显示它，而「只剩一个」几乎总是因为别的成员被 `@requires` 隐掉了（没装
# MariaDB，「数据库」栏就只剩 Valkey，主屏于是像在说这一栏只有 Valkey）——
# 这一行要回答的正是「这一栏本来有什么」。但写成「MariaDB 与 Valkey」这样点名
# 软件的话，装一个卸一个就与屏幕上真实列出的东西对不上，那比没有说明更糟。
# 成员多于一个时菜单列成员名，不用这一列：那时「现在能点什么」信息量更大。
# 顶层分组在菜单里只是分区标题，标题没有说明列 —— 所以下面只有收纳分组带说明。

# 三个顶层区按**运维动作的性质**分，不按脚本类型分：
# 跑着的业务（高频）· 持续在做的照看（后台）· 一次性的形态改变（低频）。
# 这条线同时决定了新脚本该往哪儿放 —— 装个软件是改变机器形态，看日志是观察，
# 建个库是日常业务，三者各归其位。

# --- 服务：跑着的业务，日常高频 ---
svc          | 服务    |  10 |
web          | 网站    |  20 | svc | 建站、Web 服务、证书与站点管理
db           | 数据库  |  30 | svc | 数据库与缓存：建库、账号、备份、访问控制
container    | 容器    |  40 | svc | 容器、镜像、卷与 compose 项目

# --- 维护：持续在做的照看，配好之后自己运转 ---
ops          | 维护    |  50 |
security     | 安全    |  60 | ops | 体检、登录、防火墙、补丁与凭据
backup       | 备份    |  70 | ops | 备份、归档与恢复
monitor      | 监控    |  80 | ops | 系统状态、操作日志与只读面板

# --- 系统：一次性的形态改变，做完就结束 ---
sys          | 系统    |  90 |
app          | 应用    | 100 | sys | 常用软件的安装、状态与卸载
toolbox      | 工具箱  | 110 | sys | 脚本更新、空间清理与外观调节
