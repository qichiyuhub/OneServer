# /etc/ssh/sshd_config.d/00-oneserver.conf
#
# 本文件由 `oneserver safe ssh` 生成，每次执行整份重写。
# 要长期保留的自定义项请写进 /etc/ssh/sshd_config，或另建一个片段文件。
#
# **文件名以 00- 开头是有意的。** sshd 的取值规则是「第一次出现的值生效」，
# 而主配置里的 `Include /etc/ssh/sshd_config.d/*.conf` 按文件名字典序读入 ——
# 排在后面的文件说什么都没用。Ubuntu 云镜像自带的 50-cloud-init.conf 里
# 写着 `PasswordAuthentication yes`，用 99- 命名的加固片段会被它整个盖掉。
#
# 删掉本文件即可回到发行版默认（回到 22 端口、密码登录按其他配置决定）。
Port %%PORT%%
PubkeyAuthentication %%PUBKEY_AUTH%%
PasswordAuthentication %%PASSWORD_AUTH%%
# 关掉密码登录必须连它一起关：PAM 的 keyboard-interactive 是另一条口子，
# 只关 PasswordAuthentication 的话密码照样能登进来（这是最常见的加固漏项）。
KbdInteractiveAuthentication %%KBD_INTERACTIVE%%
PermitRootLogin %%PERMIT_ROOT_LOGIN%%
