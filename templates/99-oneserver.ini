; OneServer 的 PHP 配置。落在 conf.d 里，它在 php.ini 之后加载，同名项以这里为准。
;
; 收录规则：安全不变量一律钉死，其余只写与发行版默认**不同**的值。
; 与发行版一致的值不重复抄——抄了就得跟着发行版一起维护，这正是要避免的。

; 内存预算，与 www.conf 的 pm.max_children 成对
memory_limit = 128M

; www.conf 的 request_terminate_timeout 按这两个值定
max_execution_time = 30
max_input_time = 60

; post_max_size 必须大于 upload_max_filesize：POST 体还带 multipart 边界与其他
; 字段，两者相等时贴着上限的那个文件必定失败
post_max_size = 80M
upload_max_filesize = 64M

; 发行版默认 128M，1G 机器上砍半。interned_strings_buffer 是从这块里划走的，
; 不是额外内存
opcache.memory_consumption = 64

; --- 以下为安全不变量：与发行版当前默认一致也照写，不依赖它保持不变 ---

expose_php = Off
allow_url_fopen = Off
allow_url_include = Off
request_order = "GP"

; 启动期错误不受 display_errors 管，单独关；异常栈里的参数与字符串会进日志，
; 默认会把数据库密码一类的东西带出去
display_startup_errors = Off
zend.exception_ignore_args = On
zend.exception_string_param_max_len = 0

; save_path 在 Debian 上来自编译期默认值而非配置文件，钉死才不依赖这一点。
; 它必须与 gc_probability=0 成对：/var/lib/php/sessions 权限 1733，www-data 列不了
; 目录，PHP 自己的 GC 在这个路径上失效，清理由 phpsessionclean.timer 负责。
session.save_path = "/var/lib/php/sessions"
session.gc_probability = 0
session.cookie_httponly = 1
session.cookie_secure = 1
session.use_strict_mode = 1

disable_functions = pcntl_alarm,pcntl_fork,pcntl_waitpid,pcntl_wait,pcntl_wifexited,pcntl_wifstopped,pcntl_wifsignaled,pcntl_wifcontinued,pcntl_wexitstatus,pcntl_wtermsig,pcntl_wstopsig,pcntl_signal,pcntl_signal_get_handler,pcntl_signal_dispatch,pcntl_get_last_error,pcntl_strerror,pcntl_sigprocmask,pcntl_sigwaitinfo,pcntl_sigtimedwait,pcntl_exec,pcntl_getpriority,pcntl_setpriority,pcntl_async_signals,system,exec,shell_exec,passthru,popen,proc_open,show_source
