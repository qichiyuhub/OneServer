[www]
user = www-data
group = www-data

listen = /run/php/php%%PHP_VERSION%%-fpm.sock
listen.owner = www-data
listen.group = www-data
listen.mode = 0660

; 1 核 1G 上与 MariaDB、Valkey 共存的保守取值。2 × 128M 只是两个请求里受
; memory_limit 约束的那部分，不含 OPcache、master 与扩展的原生分配。
pm = ondemand
pm.max_children = 2
pm.process_idle_timeout = 10s
pm.max_requests = 500

; max_execution_time 不计 I/O 等待，卡在数据库或外部请求上的 worker 只能由它来收。
; 120s 是 60s 输入解析加 30s 脚本执行之上的墙钟兜底；更慢的上传由 max_input_time 管。
request_terminate_timeout = 120s

catch_workers_output = yes
php_admin_flag[display_errors] = off
php_admin_value[error_log] = /var/log/php%%PHP_VERSION%%/php_errors.log
php_admin_flag[log_errors] = on
php_admin_value[memory_limit] = 128M